name: welcome

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            Hi 👋, welcome to snipp! Thanks for opening your first issue.

            A maintainer will triage this within 48 hours.

            In the meantime, if your issue is one of these:
            - **A bug**: please make sure you've filled in the version + reproduction steps. We can't fix what we can't reproduce.
            - **A new compressor request**: see [CONTRIBUTING.md](https://github.com/thinkfi03/snipp-cli/blob/main/.github/CONTRIBUTING.md#writing-a-new-compressor) — we'll happily walk you through writing it yourself.
            - **A question**: consider moving it to [Discussions](https://github.com/thinkfi03/snipp-cli/discussions) for faster help.

          pr-message: |
            Thanks for your first PR to snipp 🎉

            A maintainer will review within 48 hours. While you wait:
            - Check that all CI checks pass (tests, lint)
            - Make sure your branch is up to date with `main`
            - Re-read your own diff once with fresh eyes — the second pass usually catches a TODO or a stray `print()`

            See [CONTRIBUTING.md](https://github.com/thinkfi03/snipp-cli/blob/main/.github/CONTRIBUTING.md) for the full review checklist.
