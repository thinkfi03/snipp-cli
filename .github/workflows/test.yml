name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,mcp,tokenizers]"

      - name: Run tests
        run: pytest -q --tb=short

      - name: Smoke test the CLI
        run: |
          snipp --help
          snipp demo
          snipp bench

      - name: Smoke test the MCP server
        if: matrix.python-version == '3.13' && matrix.os == 'ubuntu-latest'
        run: |
          (printf '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}\n{"jsonrpc":"2.0","method":"notifications/initialized"}\n{"jsonrpc":"2.0","id":2,"method":"tools/list"}\n'; sleep 2) | snipp-mcp 2>/dev/null > /tmp/out.jsonl
          python -c "
          import json, sys
          tools = []
          for line in open('/tmp/out.jsonl'):
              line = line.strip()
              if not line: continue
              try: d = json.loads(line)
              except: continue
              if d.get('id') == 2:
                  tools = [t['name'] for t in d['result']['tools']]
          assert len(tools) == 10, f'expected 10 tools, got {len(tools)}: {tools}'
          print(f'✓ MCP server registered {len(tools)} tools')
          "
